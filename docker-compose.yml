services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat_app
      POSTGRES_USER: chat_app
      POSTGRES_PASSWORD: chat_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_app -d chat_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        WORKSPACE: "@chat-app/user-service"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://chat_app:chat_app@postgres:5432/chat_app
      JWT_ACCESS_SECRET: local-development-secret-change-in-production
      JWT_ACCESS_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN_DAYS: 30
    command:
      - sh
      - -c
      - npm run db:migrate -w @chat-app/user-service && npm run start -w @chat-app/user-service
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        WORKSPACE: "@chat-app/api-gateway"
    environment:
      PORT: 3000
      CLIENT_ORIGIN: http://localhost:4173
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "4173:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
