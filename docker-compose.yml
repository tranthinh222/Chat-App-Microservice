x-postgres-defaults: &postgres-defaults
  image: ${POSTGRES_DOCKER_IMAGE}
  restart: unless-stopped

x-postgres-healthcheck: &postgres-healthcheck
  interval: 5s
  timeout: 5s
  retries: 10

services:
  kafka:
    image: ${KAFKA_DOCKER_IMAGE}
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: ${KAFKA_UI_DOCKER_IMAGE}
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  user-postgres:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: ${USER_POSTGRES_DATABASE}
      POSTGRES_USER: ${USER_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U ${USER_POSTGRES_USERNAME} -d ${USER_POSTGRES_DATABASE}"]

  friendship-postgres:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: ${FRIENDSHIP_POSTGRES_DATABASE}
      POSTGRES_USER: ${FRIENDSHIP_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${FRIENDSHIP_POSTGRES_PASSWORD}
    ports:
      - "${FRIENDSHIP_POSTGRES_HOST_PORT}:5432"
    volumes:
      - friendship_postgres_data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U ${FRIENDSHIP_POSTGRES_USERNAME} -d ${FRIENDSHIP_POSTGRES_DATABASE}"]

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        WORKSPACE: "@chat-app/user-service"
    environment:
      PORT: ${USER_SERVICE_PORT}
      DATABASE_URL: ${USER_DATABASE_INTERNAL_URL}
      JWT_ACCESS_SECRET: ${SHARED_JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${USER_ACCESS_TOKEN_EXPIRES_IN}
      REFRESH_TOKEN_EXPIRES_IN_DAYS: ${USER_REFRESH_TOKEN_EXPIRES_IN_DAYS}
    command:
      - sh
      - -c
      - npm run db:migrate -w @chat-app/user-service && npm run start -w @chat-app/user-service
    depends_on:
      user-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${USER_SERVICE_PORT}/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  friendship-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        WORKSPACE: "@chat-app/friendship-service"
    environment:
      PORT: ${FRIENDSHIP_SERVICE_PORT}
      DATABASE_URL: ${FRIENDSHIP_DATABASE_INTERNAL_URL}
      JWT_ACCESS_SECRET: ${SHARED_JWT_ACCESS_SECRET}
      USER_SERVICE_URL: ${USER_SERVICE_INTERNAL_URL}
      USER_SERVICE_REQUEST_TIMEOUT_MS: ${FRIENDSHIP_USER_SERVICE_REQUEST_TIMEOUT_MS}
    command:
      - sh
      - -c
      - npm run db:deploy -w @chat-app/friendship-service && npm run start -w @chat-app/friendship-service
    depends_on:
      friendship-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${FRIENDSHIP_SERVICE_PORT}/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        WORKSPACE: "@chat-app/api-gateway"
    environment:
      PORT: ${API_GATEWAY_PORT}
      CORS_ALLOWED_ORIGIN: ${API_GATEWAY_CORS_ALLOWED_ORIGIN}
      USER_SERVICE_URL: ${USER_SERVICE_INTERNAL_URL}
      FRIENDSHIP_SERVICE_URL: ${FRIENDSHIP_SERVICE_INTERNAL_URL}
    depends_on:
      user-service:
        condition: service_healthy
      friendship-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${API_GATEWAY_PORT}/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      API_GATEWAY_URL: ${WEB_API_GATEWAY_INTERNAL_URL}
    ports:
      - "${WEB_HOST_PORT}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  friendship_postgres_data:
  kafka_data:
