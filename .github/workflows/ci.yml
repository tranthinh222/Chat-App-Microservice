name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: |
          npm run db:generate -w @chat-app/user-service
          npm run db:generate -w @chat-app/friendship-service
          npm run db:generate -w @chat-app/notification-service

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Start integration infrastructure
        run: docker compose --env-file .env.example up -d --wait notification-postgres kafka

      - name: Apply notification migrations
        env:
          DATABASE_URL: postgresql://notification_app:notification_app@localhost:5434/notification_db
        run: npm run db:deploy -w @chat-app/notification-service

      - name: Integration tests
        env:
          INTEGRATION_DATABASE_URL: postgresql://notification_app:notification_app@localhost:5434/notification_db
          KAFKA_BROKERS: localhost:9092
        run: npm run test:integration -w @chat-app/notification-service

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Stop integration infrastructure
        if: always()
        run: docker compose --env-file .env.example down --volumes
